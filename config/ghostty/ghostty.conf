config-file = active-theme
font-family = DankMono Nerd Font
font-family-italic = DankMono Nerd Font
window-title-font-family = DankMono Nerd Font
window-theme = dark
link-url = true
link-previews = true

working-directory = home
window-inherit-working-directory = true
title-report = true
copy-on-select = clipboard
background-opacity = 0.99 
background-blur = true
unfocused-split-opacity = 0.80

macos-icon = custom
