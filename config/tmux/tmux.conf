
# Use zsh
set-option -g default-shell /bin/zsh

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:RGB,ghostty:RGB"

set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-features ",*:hyperlinks"

# Remove escape delay (important for zsh/vim)
set -sg escape-time 10

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback buffer
set -g history-limit 150000

# Theme-dependent options. THEME_* is inherited from the launching shell (zshenv sources .env).
run 'tmux set -g pane-border-style "fg=$THEME_GREY_2"'
run 'tmux set -g window-status-current-format "#[fg=$THEME_ACCENT_11,italics]  ##{?##{==:##{pane_current_command},zsh},##{b:pane_current_path},##{pane_current_command}} #[default]  "'
run 'tmux set -g window-status-format "#[fg=$THEME_GREY_7]  ##{?##{==:##{pane_current_command},zsh},##{b:pane_current_path},##{pane_current_command}}  #[default]"'
run 'tmux set -g status-format[1] "#[fill=default]"'


# Status bar
set -g status 2
set -g status-position top
set -g status-style bg=default,fg=default
set -g status-left '#($DOTFILES/config/tmux/tmux-header.sh left)'
set -g status-left-length 80
set -g status-right '#($DOTFILES/config/tmux/tmux-header.sh right)'
set -g status-right-length 120
set -g status-justify left
set -g status-interval 1

set -g automatic-rename off


# Required for ClaudeCode in Tmux https://code.claude.com/docs/en/terminal-config
set -g allow-passthrough all
set -g mouse on
set -g focus-events on


# Pane navigation (vim-style, no prefix needed)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind | split-window -hb

# Press prefix + r to reload tmux.conf
bind r source-file "~/repos/dev.nicholaswagner/dotfiles/config/tmux/tmux.conf"
bind k display-popup -d '#{pane_current_path}' -E "find . -type f | fzf --preview 'fzf-preview {}' --preview-window '~25'"

set -g allow-passthrough all

# set -s escape-time 0
set -g terminal-overrides 'xterm*:Smulx=\E[4::%p1%dm' # gemini -> forces tmux to use a more modern parser for iTerm-like sequences.
