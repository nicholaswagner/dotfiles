# Tokyo Sandwich tmux config

# Use zsh
set-option -g default-shell /bin/zsh

# True color support
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Remove escape delay (important for zsh/vim)
set -sg escape-time 10

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback buffer
set -g history-limit 10000

# Status bar off (banner pane handles it)
set -g status off

# Pane borders — Tokyo Sandwich colors
set -g pane-border-style "fg=#1a1b26"
set -g pane-active-border-style "fg=#1a1b26"
