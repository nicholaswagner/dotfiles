# Tokyo Sandwich tmux config

# Use zsh
set-option -g default-shell /bin/zsh

# True color support
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Remove escape delay (important for zsh/vim)
set -sg escape-time 10

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback buffer
set -g history-limit 10000


# Pane borders — Tokyo Sandwich colors
set -g pane-border-style "fg=#1a1b26"
set -g pane-active-border-style "fg=#1a1b26"


# Status bar — top header
set -g status on
set -g status-position top
set -g status-style bg=default,fg=default
set -g status-left '#($DOTFILES/scripts/tmux-header.sh)'
set -g status-left-length 220
set -g status-right ''
set -g status-justify left
set -g status-interval 1
set -g window-status-format '  #W  '
set -g window-status-current-format '#[fg=#c8ff00,bold]  #W  #[default]'

set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
